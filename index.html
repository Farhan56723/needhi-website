<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Portal | Ethereal Dreamspace</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Playfair+Display:ital,wght=0,900;1,600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        .font-luxury { font-family: 'Playfair Display', serif; }
        .font-sans-premium { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .premium-gpu {
            will-change: transform, opacity, filter, background;
            transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .animated-cosmic-bg {
            background: radial-gradient(circle at 50% 50%, rgba(13, 10, 26, 0.95) 0%, rgba(4, 3, 8, 0.98) 60%, #010103 100%), 
                        radial-gradient(circle at center, transparent 20%, rgba(0, 0, 0, 0.85) 100%);
            position: relative;
            transition: background 3.5s cubic-bezier(0.33, 1, 0.68, 1);
        }
        
        .apocalypse-warn {
            background: linear-gradient(-45deg, #ffe4e6, #fee2e2, #f1f5f9, #f8fafc) !important;
            background-size: 400% 400% !important;
            animation: warningGlitchFlow 0.3s ease infinite !important;
        }
        @keyframes warningGlitchFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes safeStickerOrbit {
            0% { top: 12%; left: 8%; transform: scale(1) rotate(0deg); }
            25% { top: 14%; left: 65%; transform: scale(1.05) rotate(6deg); }
            50% { top: 68%; left: 68%; transform: scale(0.95) rotate(-6deg); }
            75% { top: 64%; left: 10%; transform: scale(1.03) rotate(4deg); }
            100% { top: 12%; left: 8%; transform: scale(1) rotate(0deg); }
        }
        .animate-constrained-sticker {
            position: fixed;
            animation: safeStickerOrbit 20s linear infinite;
        }

        .animate-glass-platform {
            animation: platformFloat 5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        }
        @keyframes platformFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .heart-mask {
            -webkit-text-security: none;
            color: #ff2a74 !important;
            text-shadow: 0 0 15px rgba(255, 42, 116, 0.5);
        }

        .neon-border-glow {
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.75), inset 0 0 15px rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(10, 8, 20, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .phone-container {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 892px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .single-bulbs-garland {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%) scale(1.03);
            width: 100%;
            max-width: 460px;
            height: auto;
            pointer-events: none;
            z-index: 30;
            mix-blend-mode: screen;
            transition: filter 0.4s ease;
        }

        .async-glow-node {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            mix-blend-mode: screen;
            filter: blur(40px);
            opacity: 0;
            will-change: opacity, transform, background;
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 1s ease, background 1.2s ease;
        }

        .original-center-bouquet {
            position: absolute;
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -46%);
            width: 88%;
            max-width: 360px;
            pointer-events: none;
            z-index: 4; 
            opacity: 1; 
            filter: drop-shadow(0 15px 40px rgba(244, 63, 94, 0.2)) contrast(1.4) saturate(1.6) brightness(1.2);
        }

        .gold-dust-node {
            position: absolute;
            background: radial-gradient(circle, rgba(253, 186, 116, 0.7) 0%, rgba(245, 158, 11, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            will-change: transform, opacity;
        }

        .grass-fairy-light {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #fef08a;
            pointer-events: none;
            z-index: 7; 
            mix-blend-mode: screen;
            will-change: opacity, filter;
        }

        .countdown-glow {
            text-shadow: 0 0 12px rgba(244, 63, 94, 0.6);
        }
    </style>
</head>
<body id="masterBody" class="animated-cosmic-bg text-slate-800 font-sans-premium min-h-screen w-full flex items-center justify-center overflow-hidden relative select-none">

    <audio id="sfxPop" src="sfx/pop.wav" preload="auto"></audio>
    <audio id="sfxError" src="sfx/error.wav" preload="auto"></audio>
    <audio id="sfxSuccess" src="sfx/success.wav" preload="auto"></audio>
    <audio id="sfxExplode" src="sfx/explode.wav" preload="auto"></audio>

    <div id="asyncLightsMatrix" class="absolute inset-0 pointer-events-none z-0"></div>
    <div id="goldDustMatrixContainer" class="absolute inset-0 pointer-events-none overflow-hidden z-10"></div>
    <div id="grassFairyLightsStage" class="absolute bottom-0 left-0 w-full h-[25vh] pointer-events-none overflow-hidden z-10"></div>

    <img src="images/bulbs-string.png" class="single-bulbs-garland premium-gpu" alt="Hanging Bulbs String">
    <img src="images/lotus-bg.png" class="original-center-bouquet premium-gpu" alt="Original Center Bouquet">

    <canvas id="touchCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-40"></canvas>

    <!-- 🌸 HIGH-END VIEWPORT CONSTRAINED ROAMING CHARACTER STICKER (ROZ KA CODE BATAEGI) -->
    <div id="roamingDoll" onclick="handleDynamicStickerClicks()" class="animate-constrained-sticker w-20 h-28 cursor-pointer select-none z-50 premium-gpu filter drop-shadow-[0_10px_20px_rgba(244,63,94,0.12)]">
        <img id="mascotDynamicImg" src="images/mascot.png" class="w-full h-full object-contain" alt="Cute Mascot Doll">
        <div id="dollBubble" class="absolute -top-10 left-1/2 -translate-x-1/2 bg-white border border-pink-100 py-1 px-3 rounded-xl shadow-md text-[10px] font-extrabold text-pink-500 tracking-wide scale-100 transition-all duration-300 whitespace-nowrap">
            Tap for Today's Key! 🔑🌸
        </div>
    </div>

    <!-- 📱 PURE PHONE RATIO CONTAINER BOUNDARY -->
    <div class="phone-container relative z-20">
        
        <div id="magneticWrapper" class="w-full flex flex-col items-center justify-center relative premium-gpu animate-glass-platform py-4">
            
            <!-- 🔑 THE SECURITY PASSCODE MODULE LAYER -->
            <div id="passcodePortal" class="w-full rounded-[2.5rem] p-6 text-center relative premium-gpu transition-all duration-300 neon-border-glow">
                <span class="text-[9px] font-extrabold tracking-[0.45em] text-pink-500 uppercase block mb-1">SECURITY SYNC</span>
                <h1 class="font-luxury font-black text-2xl text-white mb-5 tracking-tight">Decrypt Your Sky ☁️</h1>
                
                <div class="relative w-full mb-4">
                    <div id="heartDisplayOverlay" class="absolute inset-0 flex items-center justify-center text-2xl font-bold tracking-[0.4em] pointer-events-none heart-mask text-center w-full z-10 select-none"></div>
                    <input type="text" id="secretInput" pattern="[0-9]*" inputmode="numeric" maxlength="4" placeholder="••••" oninput="processHeartTextFormatting(this)"
                        class="w-full text-center text-2xl font-bold tracking-[0.4em] py-3 bg-slate-950/60 border border-white/10 rounded-2xl focus:outline-none focus:border-pink-500 opacity-100 text-transparent select-none selection:bg-transparent caret-pink-500 shadow-inner placeholder-slate-700 transition-all duration-300 font-sans-premium relative z-0" style="-webkit-text-fill-color: transparent; -webkit-user-select: none;" />
                </div>
                
                <button onclick="verifySecretCode()" class="w-full bg-gradient-to-r from-pink-500 via-rose-500 to-purple-600 text-white font-extrabold tracking-[0.22em] text-[10px] py-4 rounded-xl shadow-md border border-white/10 premium-gpu">
                    INITIALIZE UNIVERSE 🚀
                </button>

                <div class="mt-5 pt-3 border-t border-white/5 flex flex-col items-center">
                    <button onclick="triggerMascotHintReveal()" class="text-[9px] font-extrabold text-slate-300 uppercase tracking-widest hover:text-white transition-colors flex items-center gap-1.5 bg-white/5 px-3 py-1 rounded-full border border-white/5">
                        💡 View Hint
                    </button>
                    <p id="hintTextDisplay" class="text-[10px] font-bold text-pink-400 h-3 mt-1.5 transition-all duration-300 tracking-wide"></p>
                </div>

                <p id="errorFeedback" class="text-[9px] text-rose-500 font-extrabold mt-2 h-3 tracking-wider uppercase"></p>
            </div>

            <!-- 🎁 NEW SURPRISE CARD LAYER: CODE DALNE PAR ISSI WINDOW MEIN KHULEGA -->
            <div id="surprisePortal" class="w-full rounded-[2.5rem] p-6 text-center absolute z-20 premium-gpu opacity-0 scale-75 pointer-events-none transition-all duration-500 neon-border-glow flex flex-col items-center">
                <span class="text-[9px] font-extrabold tracking-[0.45em] text-pink-400 uppercase block mb-1">TODAY'S UNIVERSE UNLOCKED</span>
                
                <!-- ⏳ REAL-TIME COUNTDOWN TIMER EMBEDDED INSIDE SURPRISE WINDOW -->
                <div class="w-full bg-slate-950/60 border border-white/5 rounded-2xl py-3 px-2 mb-4 mt-2">
                    <p class="text-[8px] font-extrabold tracking-widest text-slate-400 uppercase mb-1">The Ultimate Countdown to 31 July</p>
                    <div id="liveClockDisplay" class="font-sans-premium font-black text-lg text-pink-500 tracking-wide countdown-glow">00d : 00h : 00m : 00s</div>
                </div>

                <!-- 📜 DAILY CHANGING CONTENT TEXT HOOK -->
                <div class="w-full bg-black/30 border border-white/5 rounded-2xl p-4 text-left overflow-y-auto max-h-[220px]">
                    <h3 id="surpriseTitle" class="font-luxury font-black text-white text-base mb-1 tracking-wide"></h3>
                    <p id="surpriseBody" class="text-xs font-medium text-slate-300 leading-relaxed tracking-wide"></p>
                </div>

                <p class="text-[9px] font-bold text-slate-400 tracking-widest uppercase mt-4">See you tomorrow with a new memory! ✨❤️</p>
            </div>

        </div>

    </div>

    <script>
        // =========================================================================
        // 📅 ROZ KAA DATA MATRIX CONFIGURATION PANEL
        // Is section me tum roz bina kisi loop tension ke parameters edit kar sakte ho!
        // =========================================================================
        const DAILY_SURPRISE_CONFIG = {
            code: "1206",               // Today's 4-Digit secret passcode 
            title: "Day 49: The Beautiful Beginning ✨", // Title of today's memory
            body: "OMG, look at this! Our countdown has officially started. From today onwards, every single day until July 31st, a new secret lock and a unique memory will unlock right here. I want to make every moment leading up to your birthday incredibly special. Sleep well and get ready for the journey! ❤️🌸" // Today's special note
        };

        let attempts = 0;
        let dollTapsCount = 0;
        let isPasswordResolved = false;

        const playSFX = (id) => {
            const audio = document.getElementById(id);
            if (audio) { audio.currentTime = 0; audio.play().catch(e => {}); }
        };

        // --- 🧪 ASYNCHRONOUS LIGHTING ENGINE & FLUID BACKGROUND MATRIX ---
        function initAsynchronousLightingMatrix() {
            const trackLayer = document.getElementById("asyncLightsMatrix");
            const nodeCount = 6; 
            const aestheticColors = [
                "rgba(245, 158, 11, ",  
                "rgba(251, 146, 60, ",  
                "rgba(244, 63, 94, ",   
                "rgba(139, 92, 246, "   
            ];

            for(let i=0; i<nodeCount; i++) {
                const node = document.createElement("div");
                node.className = "async-glow-node premium-gpu";
                
                const xPos = (i * (100 / nodeCount)) + (Math.random() * 5);
                const yPos = Math.floor(Math.random() * 40) + 15;
                const size = Math.floor(Math.random() * 60) + 130;

                node.style.left = `calc(${xPos}vw - ${size/2}px)`;
                node.style.top = `${yPos}px`;
                node.style.width = `${size}px`;
                node.style.height = `${size}px`;

                trackLayer.appendChild(node);
                triggerIndependentFlickerLoop(node, aestheticColors);
            }

            initGoldenDustMatrixEngine();
            initGrassFairyLightsEngine(); 

            setInterval(shiftFluidBackgroundSpectrum, 5000); 
            startUltimateLiveClockEngine(); // Run countdown core
        }

        // --- ⏳ REAL-TIME MILLISECOND BLENDED COUNTDOWN TIMING ENGINE ---
        function startUltimateLiveClockEngine() {
            const targetDate = new Date("July 31, 2026 00:00:00").getTime();
            
            function updateClock() {
                const now = new Date().getTime();
                const distance = targetDate - now;
                
                if (distance < 0) {
                    document.getElementById("liveClockDisplay").innerText = "THE UNIVERSE IS LIVE! 🎉🎂";
                    return;
                }
                
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                
                // Fixed digital clock styling padding tracking
                const dStr = days < 10 ? "0" + days : days;
                const hStr = hours < 10 ? "0" + hours : hours;
                const mStr = minutes < 10 ? "0" + minutes : minutes;
                const sStr = seconds < 10 ? "0" + seconds : seconds;
                
                document.getElementById("liveClockDisplay").innerText = `${dStr}d : ${hStr}h : ${mStr}m : ${sStr}s`;
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        function triggerIndependentFlickerLoop(nodeElement, colorsArray) {
            function tick() {
                const isActive = Math.random() > 0.28; 
                const targetOpacity = isActive ? (Math.random() * 0.35 + 0.4) : 0.03; 
                const randomColor = colorsArray[Math.floor(Math.random() * colorsArray.length)];
                
                nodeElement.style.background = `radial-gradient(circle, ${randomColor}${targetOpacity}) 0%, transparent 70%)`;
                nodeElement.style.opacity = isActive ? "1" : "0.12";
                nodeElement.style.transform = `scale(${isActive ? (Math.random() * 0.25 + 0.9) : 0.75})`;

                setTimeout(tick, Math.random() * (isActive ? 2200 : 350) + 200);
            }
            tick();
        }

        function initGrassFairyLightsEngine() {
            const stage = document.getElementById("grassFairyLightsStage");
            const lightLimit = 12; 

            for(let i=0; i<lightLimit; i++) {
                const spark = document.createElement("div");
                spark.className = "grass-fairy-light premium-gpu";
                
                spark.style.left = (Math.random() * 94 + 3) + "%";
                spark.style.bottom = (Math.random() * 90 + 10) + "px";
                
                const glowGradients = ["#fef08a", "#fed7aa", "#f472b6"];
                spark.style.backgroundColor = glowGradients[i % glowGradients.length];

                stage.appendChild(spark);

                function runSparkFlicker() {
                    const localActive = Math.random() > 0.3;
                    gsap.to(spark, {
                        opacity: localActive ? Math.random() * 0.9 + 0.3 : 0.1,
                        filter: localActive ? `drop-shadow(0 0 ${Math.random()*6 + 3}px ${spark.style.backgroundColor})` : "none",
                        duration: Math.random() * 0.6 + 0.2,
                        onComplete: runSparkFlicker,
                        delay: Math.random() * 0.3
                    });
                }
                runSparkFlicker();
            }
        }

        function initGoldenDustMatrixEngine() {
            const dustBox = document.getElementById("goldDustMatrixContainer");
            const dustParticleLimit = 25; 

            for(let i = 0; i < dustParticleLimit; i++) {
                const singleParticle = document.createElement("div");
                singleParticle.className = "gold-dust-node premium-gpu";
                
                const dimension = Math.random() * 4 + 2; 
                singleParticle.style.width = dimension + "px";
                singleParticle.style.height = dimension + "px";
                singleParticle.style.left = Math.random() * 100 + "vw";
                singleParticle.style.top = Math.random() * 100 + "vh";
                singleParticle.style.opacity = Math.random() * 0.5 + 0.2;

                dustBox.appendChild(singleParticle);

                gsap.to(singleParticle, {
                    y: "-=" + (Math.random() * 120 + 80),
                    x: "+=" + (Math.random() * 40 - 20),
                    opacity: 0,
                    duration: Math.random() * 8 + 6,
                    repeat: -1,
                    ease: "sine.inOut",
                    delay: Math.random() * -10
                });
            }
        }

        function shiftFluidBackgroundSpectrum() {
            const body = document.getElementById("masterBody");
            if (body.classList.contains("apocalypse-warn")) return;

            const gradients = [
                "radial-gradient(circle at 50% 50%, #100826 0%, #030206 75%, #010103 100%), radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.8) 100%)",
                "radial-gradient(circle at 50% 50%, #1b0918 0%, #040208 75%, #010102 100%), radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.8) 100%)",
                "radial-gradient(circle at 50% 50%, #081026 0%, #010308 75%, #000002 100%), radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.8) 100%)",
                "radial-gradient(circle at 50% 50%, #140b21 0%, #04020a 75%, #010003 100%), radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.8) 100%)"
            ];

            body.style.background = gradients[Math.floor(Math.random() * gradients.length)];
        }

        function processHeartTextFormatting(inputElement) {
            inputElement.value = inputElement.value.replace(/[^0-9]/g, '');
            const len = inputElement.value.length;
            const overlay = document.getElementById("heartDisplayOverlay");
            let heartString = "";
            for (let i = 0; i < len; i++) heartString += "💖";
            overlay.innerText = heartString;

            if(len > 0) {
                const body = document.getElementById("masterBody");
                body.style.background = "radial-gradient(circle at 50% 50%, #1c103a 0%, #04020a 80%, #010103 100%), radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.8) 100%)";
            }
        }

        function triggerMascotHintReveal() {
            playSFX('sfxPop');
            const hintBox = document.getElementById("hintTextDisplay");
            hintBox.innerText = "Click on the sticker to get the key! ✨";
            hintBox.className = "text-[10px] font-bold text-pink-400 h-3 mt-1.5 transition-all duration-300 tracking-wide scale-100";
        }

        // --- 🌸 MASCOT CLICK HANDLER: STICKER HI AAJ KA CODE SCRIPTPANEL MEIN SHOW KAREGA ---
        function handleDynamicStickerClicks() {
            playSFX('sfxPop'); 
            const targetImg = document.getElementById('mascotDynamicImg');
            const bubble = document.getElementById("dollBubble");
            const dollNode = document.getElementById("roamingDoll");
            
            gsap.fromTo(dollNode, { scale: 0.9, rotation: -8 }, { scale: 1.05, rotation: 8, duration: 0.3, ease: "back.out(1.5)" });

            if (!isPasswordResolved) {
                dollTapsCount++;
                if (dollTapsCount === 1) {
                    targetImg.src = "images/mascot_confused.png";
                    bubble.innerText = "Hehe, looking for today's code? 😜";
                    setTimeout(() => { targetImg.src = "images/mascot.png"; }, 1500);
                } 
                else if (dollTapsCount === 2) {
                    targetImg.src = "images/mascot_confused.png";
                    bubble.innerText = "One more tap and I'll leak it! 🤫✨";
                    setTimeout(() => { targetImg.src = "images/mascot.png"; }, 1500);
                } 
                else if (dollTapsCount >= 3) {
                    targetImg.src = "images/mascot_happy.png";
                    // Dynamic configuration read to stay synced automatically
                    bubble.innerText = `Today's Key is ${DAILY_SURPRISE_CONFIG.code}! 🔑✨`;
                    setTimeout(() => { 
                        targetImg.src = "images/mascot.png"; 
                        bubble.innerText = "Tap for Today's Key! 🔑🌸";
                        dollTapsCount = 0; 
                    }, 5000);
                }
            } else {
                targetImg.src = "images/mascot_excited.png";
                bubble.innerText = "Enjoy today's magical space! 🥰🚀";
                setTimeout(() => { targetImg.src = "images/mascot.png"; }, 2500);
            }

            const r = dollNode.getBoundingClientRect();
            for(let i=0; i<6; i++) touchParticles.push(new TouchSparkle(r.left + 35, r.top + 35));
        }

        // --- 🔑 VERIFY SECRET ACCESS CODE CODE PANEL ---
        function verifySecretCode() {
            const inputField = document.getElementById('secretInput');
            const errorBox = document.getElementById('errorFeedback');
            const targetImg = document.getElementById('mascotDynamicImg');

            // Reads directly from the config object at the top
            if (inputField.value.trim() === DAILY_SURPRISE_CONFIG.code) {
                playSFX('sfxSuccess');
                isPasswordResolved = true;
                
                // Map text strings dynamically inside index portal element cards safely
                document.getElementById("surpriseTitle").innerText = DAILY_SURPRISE_CONFIG.title;
                document.getElementById("surpriseBody").innerText = DAILY_SURPRISE_CONFIG.body;

                targetImg.src = "images/mascot_happy.png";
                document.getElementById("dollBubble").innerText = "YAY! Day Unlocked! 😍🎉";

                gsap.to("#passcodePortal", {
                    y: 40, opacity: 0, scale: 0.8, duration: 0.4, ease: "power3.in",
                    onComplete: () => {
                        document.getElementById("passcodePortal").remove();
                        const surpriseCard = document.getElementById("surprisePortal");
                        surpriseCard.classList.remove("pointer-events-none", "opacity-0", "scale-75");
                        surpriseCard.classList.add("opacity-100", "scale-100", "pointer-events-auto");
                        setTimeout(() => { targetImg.src = "images/mascot.png"; }, 1500);
                    }
                });
            } else {
                playSFX('sfxError');
                errorBox.innerText = "ACCESS DENIED! WRONG DAILY CODE! 🔒";
                inputField.value = "";
                document.getElementById("heartDisplayOverlay").innerText = ""; 
                
                targetImg.src = "images/mascot_sad.png";
                document.getElementById("dollBubble").innerText = "Ugh, wrong code! 🥺";
                
                gsap.fromTo("#passcodePortal", { x: -10 }, { x: 10, duration: 0.04, repeat: 4, yoyo: true });
                setTimeout(() => { targetImg.src = "images/mascot.png"; }, 2000);
            }
        }

        // --- ORIGINAL TOUCH SPARK TRAIL GENERATOR ---
        const touchCanvas = document.getElementById('touchCanvas');
        const tCtx = touchCanvas.getContext('2d');
        let touchParticles = [];
        touchCanvas.width = window.innerWidth; touchCanvas.height = window.innerHeight;

        class TouchSparkle {
            constructor(x, y, symbol = null) {
                this.x = x; this.y = y; this.size = Math.random() * 12 + 10;
                this.speedX = (Math.random() - 0.5) * 4; this.speedY = (Math.random() - 0.5) * 4;
                this.opacity = 1;
                this.sym = symbol ? symbol : ['✨', '🌸', '💖'][Math.floor(Math.random() * 3)];
            }
            update() { this.x += this.speedX; this.y += this.speedY; this.opacity -= 0.02; }
            draw() { tCtx.save(); tCtx.globalAlpha = this.opacity; tCtx.font = `${this.size}px serif`; tCtx.fillText(this.sym, this.x, this.y); tCtx.restore(); }
        }

        window.addEventListener('mousemove', (e) => { touchParticles.push(new TouchSparkle(e.clientX, e.clientY)); });
        window.addEventListener('touchmove', (e) => { if(e.touches.length) touchParticles.push(new TouchSparkle(e.touches[0].clientX, e.touches[0].clientY)); });

        function animateTouchTrail() {
            tCtx.clearRect(0, 0, touchCanvas.width, touchCanvas.height);
            for (let i = 0; i < touchParticles.length; i++) {
                touchParticles[i].update(); touchParticles[i].draw();
                if (touchParticles[i].opacity <= 0) { touchParticles.splice(i, 1); i--; }
            }
            requestAnimationFrame(animateTouchTrail);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initAsynchronousLightingMatrix();
            animateTouchTrail();
        });
    </script>
</body>
